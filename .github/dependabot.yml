version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 2026-11-05：把同类更新合并成一个 PR，避免一周堆出 5+ 个待评审分支。
    # 安全更新不走分组，仍然单独出 PR 以便尽快合并。
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 大版本升级要单独评估（Next 16 / Vitest 5 / TypeScript 7 / @types/node 26
      # 均有破坏性变更或需要配套调整），不进入每周自动 PR；
      # 需要时手动升级并跑全量门禁。安全修复若真的只在大版本里，
      # 仍会以 security update 形式单独出现。
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
