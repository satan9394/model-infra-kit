packages:
  - packages/*
  - apps/*
  - examples/*

# Next pins postcss to 8.4.31, which is inside the range of four open
# Dependabot alerts (GHSA-r28c-9q8g-f849, GHSA-6g55-p6wh-862q, GHSA-qx2v-qp2m-jg93,
# GHSA-fxqj-rqcc-2cmp). Force the patched 8.5 line.
overrides:
  postcss: ^8.5.23
  # 2026-11-05 安全告警收口（见 dependabot/alerts）：
  # - zod < 4.6.6：校验超大集合时内存耗尽（high）
  # - undici < 7.30.1：TLS 校验绕过 / 缓存投毒 / 多处 DoS（5 high + 2 medium）
  # - vite < 7.3.7：自定义中间件跨源脚本执行等（1 high + 3 medium + 1 low）
  # 三者都是 `ai` / `vitest` 的传递依赖，按 pnpm overrides 强制到已修复版本。
  zod: ^4.6.7
  undici: ^7.30.2
  vite: ^7.3.7
  # Dependabot GHSA-68fv-2mgg-jv7q (high): indexed source-map section offsets
  # allow an event-loop denial of service. Force the patched 1.2.2+ line.
  source-map-js: ">=1.2.2"

allowBuilds:
  esbuild: true
  msw: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.76'
  - '@ai-sdk/openai-compatible@3.0.45'
  - '@ai-sdk/provider-utils@5.0.37'
  - '@ai-sdk/provider@4.0.11'
  - ai@7.0.94
  - openai@7.12.1
  - undici@7.30.2
