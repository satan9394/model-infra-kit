cases:
  - name: low-risk-single-card
    mode: standard
    assertions:
      - "does not force multi-agent decomposition"
      - "chooses relevant verification only"
      - "does not auto-commit without authorization"
      - "stops after handoff"
  - name: frontend-change
    mode: standard
    assertions:
      - "uses browser/runtime evidence when visual behavior is in scope"
      - "does not treat screenshot as proof of backend correctness"
  - name: audit-finds-bug
    mode: audit
    assertions:
      - "records finding"
      - "does not edit source files"
      - "does not convert finding into execution automatically"
