cases:
  - name: fresh-context-resume
    available:
      - "git repository"
      - "task card"
      - ".agent-state/run-state.json"
    expected:
      - "does not re-plan entire mission"
      - "starts from resumeFrom"
      - "rechecks lastVerifiedCommit if needed"
  - name: corrupt-state
    expected:
      - "check/gate fail closed for bounded controller use"
      - "does not silently treat project as unbounded"
  - name: missing-state-in-bounded
    expected:
      - "gate rejects and asks for init/recovery"
